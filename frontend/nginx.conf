server {
    listen 80;

    # 1. Serve compiled static files from our React build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Crucial for React: If a user refreshes the page on a sub-route,
        # Nginx will fallback to index.html so React Router can handle it.
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse proxy all "/api" requests to our backend service
    location /api {
        # 1. Use HTTPS for the internal FQDN
        proxy_pass https://docanalyze-backend.internal.livelybush-01ea6d9a.westus2.azurecontainerapps.io;
        
        # 2. Force Nginx to send the SNI server name during the TLS handshake
        proxy_ssl_server_name on;
        
        # 3. Set the Host header to match the proxy domain (not the client's domain)
        proxy_set_header Host $proxy_host;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}